<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>فاتورة مبيعات ذكية</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            padding: 30px 10px;
        }

        .invoice-container {
            width: 1000px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 30px;
            transition: all 0.3s;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #1e88e5;
            padding-bottom: 20px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header h1 {
            color: #1e88e5;
            font-size: 28px;
            font-weight: bold;
        }

        .invoice-info {
            text-align: left;
            color: #555;
        }

        .invoice-info p {
            margin: 4px 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 25px;
        }

        thead {
            background: #1e88e5;
            color: white;
        }

        th, td {
            padding: 14px 12px;
            text-align: center;
            border: 1px solid #ddd;
            font-size: 15px;
        }

        tbody tr:nth-child(even) {
            background: #f8fafc;
        }

        tbody tr:hover {
            background: #eef5ff;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            text-align: center;
            transition: all 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #1e88e5;
            box-shadow: 0 0 0 3px rgba(30,136,229,0.15);
        }

        .total-row {
            background: #e3f2fd !important;
            font-weight: bold;
            font-size: 16px;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin: 25px 0;
        }

        .summary-card {
            background: #f8fafc;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 18px;
            text-align: center;
            transition: all 0.3s;
        }

        .summary-card.highlight {
            border-color: #1e88e5;
            background: #e3f2fd;
        }

        .summary-card label {
            display: block;
            font-size: 14px;
            color: #777;
            margin-bottom: 8px;
        }

        .summary-card .value {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }

        .payment-section {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin: 20px 0;
        }

        .payment-section label {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }

        .payment-section input {
            width: 200px;
            padding: 12px;
            font-size: 18px;
            border: 2px solid #1e88e5;
            border-radius: 8px;
            text-align: center;
        }

        .remaining-banner {
            background: linear-gradient(135deg, #ff9800, #f57c00);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin: 20px 0;
            font-size: 22px;
            font-weight: bold;
        }

        .remaining-banner .amount {
            font-size: 32px;
            display: block;
        }

        .actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 35px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #1e88e5;
            color: white;
        }

        .btn-primary:hover {
            background: #1565c0;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(30,136,229,0.3);
        }

        .btn-success {
            background: #4caf50;
            color: white;
        }

        .btn-success:hover {
            background: #388e3c;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76,175,80,0.3);
        }

        .btn-warning {
            background: #ff9800;
            color: white;
        }

        .btn-warning:hover {
            background: #f57c00;
            transform: translateY(-2px);
        }

        @media print {
            body {
                background: white;
                padding: 0;
            }
            .invoice-container {
                box-shadow: none;
                border-radius: 0;
                padding: 20px;
            }
            .btn {
                display: none;
            }
        }

        @media (max-width: 768px) {
            .invoice-container {
                padding: 15px;
            }
            th, td {
                padding: 8px 5px;
                font-size: 13px;
            }
            .summary-card .value {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="invoice-container" id="invoice">
        <!-- رأس الفاتورة -->
        <div class="header">
            <h1>🧾 فاتورة مبيعات ذكية</h1>
            <div class="invoice-info">
                <p><strong>رقم الفاتورة:</strong> INV-2024-001</p>
                <p><strong>التاريخ:</strong> <span id="date"></span></p>
            </div>
        </div>

        <!-- جدول المنتجات -->
        <table id="invoiceTable">
            <thead>
                <tr>
                    <th>المنتج</th>
                    <th>الكمية</th>
                    <th>سعر الوحدة</th>
                    <th>الإجمالي</th>
                    <th>المدفوع</th>
                    <th>المتبقي</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- صفوف ديناميكية -->
            </tbody>
            <tfoot>
                <tr class="total-row">
                    <td colspan="3">الإجمالي الكلي</td>
                    <td id="totalAmount">0</td>
                    <td id="totalPaid">0</td>
                    <td id="totalRemaining">0</td>
                </tr>
            </tfoot>
        </table>

        <!-- ملخص سريع -->
        <div class="summary">
            <div class="summary-card">
                <label>إجمالي الفاتورة</label>
                <div class="value" id="summaryTotal">0</div>
            </div>
            <div class="summary-card highlight">
                <label>إجمالي المدفوع</label>
                <div class="value" id="summaryPaid">0</div>
            </div>
            <div class="summary-card">
                <label>إجمالي المتبقي</label>
                <div class="value" id="summaryRemaining">0</div>
            </div>
        </div>

        <!-- إدخال المدفوع -->
        <div class="payment-section">
            <label>💰 المبلغ المدفوع إجمالاً:</label>
            <input type="number" id="totalPayment" min="0" value="0" oninput="calculateAll()">
        </div>

        <!-- المتبقي النهائي -->
        <div class="remaining-banner" id="remainingBanner">
            المتبقي النهائي
            <span class="amount" id="finalRemaining">0</span>
        </div>

        <!-- أزرار -->
        <div class="actions">
            <button class="btn btn-primary" onclick="addRow()">➕ إضافة منتج</button>
            <button class="btn btn-success" onclick="printInvoice()">🖨️ طباعة</button>
            <button class="btn btn-warning" onclick="resetInvoice()">🔄 إعادة تعيين</button>
        </div>
    </div>

    <script>
        // التاريخ الحالي
        document.getElementById('date').textContent = new Date().toLocaleDateString('ar-EG');

        // بيانات أولية
        const initialProducts = [
            { name: 'لابتوب', quantity: 2, price: 5000, paid: 8000 },
            { name: 'شاشة', quantity: 3, price: 1500, paid: 3000 },
            { name: 'طابعة', quantity: 1, price: 2000, paid: 2000 }
        ];

        function formatNumber(num) {
            return Number(num).toLocaleString('ar-EG');
        }

        function calculateRow(row) {
            const quantity = parseFloat(row.querySelector('.quantity').value) || 0;
            const price = parseFloat(row.querySelector('.price').value) || 0;
            const paid = parseFloat(row.querySelector('.paid').value) || 0;
            
            const total = quantity * price;
            const remaining = Math.max(0, total - paid);
            
            row.querySelector('.total').value = formatNumber(total);
            row.querySelector('.remaining').value = formatNumber(remaining);
            
            return { total, paid, remaining };
        }

        function calculateAll() {
            const rows = document.querySelectorAll('#tableBody tr');
            let grandTotal = 0;
            let totalPaid = 0;
            let totalRemaining = 0;

            rows.forEach(row => {
                const result = calculateRow(row);
                grandTotal += result.total;
                totalPaid += result.paid;
                totalRemaining += result.remaining;
            });

            // تحديث التذييل
            document.getElementById('totalAmount').textContent = formatNumber(grandTotal);
            document.getElementById('totalPaid').textContent = formatNumber(totalPaid);
            document.getElementById('totalRemaining').textContent = formatNumber(totalRemaining);

            // تحديث الملخص
            document.getElementById('summaryTotal').textContent = formatNumber(grandTotal);
            document.getElementById('summaryPaid').textContent = formatNumber(totalPaid);
            document.getElementById('summaryRemaining').textContent = formatNumber(totalRemaining);

            // حساب المدفوع الإجمالي والمتبقي النهائي
            const totalPayment = parseFloat(document.getElementById('totalPayment').value) || 0;
            const finalRemaining = Math.max(0, grandTotal - totalPayment);
            
            document.getElementById('finalRemaining').textContent = formatNumber(finalRemaining);

            // تغيير لون البانر حسب الحالة
            const banner = document.getElementById('remainingBanner');
            if (finalRemaining === 0) {
                banner.style.background = 'linear-gradient(135deg, #4caf50, #388e3c)';
            } else {
                banner.style.background = 'linear-gradient(135deg, #ff9800, #f57c00)';
            }
        }

        function addRow(product = null) {
            const tbody = document.getElementById('tableBody');
            const row = document.createElement('tr');
            
            row.innerHTML = `
                <td><input type="text" class="name" placeholder="اسم المنتج" value="${product?.name || ''}"></td>
                <td><input type="number" class="quantity" min="0" value="${product?.quantity || 0}" oninput="calculateAll()"></td>
                <td><input type="number" class="price" min="0" value="${product?.price || 0}" oninput="calculateAll()"></td>
                <td><input type="text" class="total" readonly value="0"></td>
                <td><input type="number" class="paid" min="0" value="${product?.paid || 0}" oninput="calculateAll()"></td>
                <td><input type="text" class="remaining" readonly value="0"></td>
            `;
            
            tbody.appendChild(row);
            calculateAll();
        }

        function resetInvoice() {
            document.getElementById('tableBody').innerHTML = '';
            document.getElementById('totalPayment').value = 0;
            
            // إضافة صفوف افتراضية
            initialProducts.forEach(product => addRow(product));
            
            calculateAll();
        }

        function printInvoice() {
            window.print();
        }

        // تهيئة الفاتورة
        resetInvoice();
    </script>
</body>
</html>
